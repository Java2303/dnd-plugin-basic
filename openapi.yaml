openapi: 3.1.0
info:
  title: D&D Game Plugin API
  version: "1.0.0"
  description: API para gestionar datos de campañas de D&D.
servers:
  - url: https://dnd-plugin-basic.onrender.com
paths:
  /store_character:
    post:
      summary: Guarda un personaje.
      operationId: storeCharacter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nombre del personaje.
                type:
                  type: string
                  description: Tipo del personaje (e.g., héroe, villano).
                attributes:
                  type: string
                  description: Atributos del personaje en formato "clave:valor;clave:valor".
                skills:
                  type: string
                  description: Habilidades del personaje como una cadena separada por comas.
                description:
                  type: string
                  description: Descripción del personaje.
      responses:
        "201":
          description: Personaje guardado con éxito.

  /retrieve_characters:
    get:
      summary: Recupera todos los personajes.
      operationId: retrieveCharacters
      responses:
        "200":
          description: Lista de personajes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  characters:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                        skills:
                          type: array
                          items:
                            type: string
                        description:
                          type: string
